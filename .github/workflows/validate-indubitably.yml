name: Validate Indubitably Phase 0

on:
  push:
    paths:
      - "indubitably/**"
      - ".github/workflows/validate-indubitably.yml"
  pull_request:
    paths:
      - "indubitably/**"
      - ".github/workflows/validate-indubitably.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indubitably
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.16
          cache: npm
          cache-dependency-path: indubitably/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate protocol, service, and plugin contracts
        run: npm run validate
